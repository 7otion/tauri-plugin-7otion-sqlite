[package]
name = "tauri-plugin-7otion-sqlite"
version = "0.1.0"
description = "SQLite for Tauri on one connection per database file, so transactions work."
authors = ["Burak Kartal"]
license = "MIT"
repository = "https://github.com/7otion/tauri-plugin-7otion-sqlite"
edition = "2024"
links = "tauri-plugin-7otion-sqlite"
exclude = [
	"/node_modules",
	"/guest-js",
	"/dist-js",
	"/package.json",
	"/bun.lock",
	"/tsconfig.json",
]

[features]
encryption = ["libsqlite3-sys/bundled-sqlcipher"]
encryption-vendored-openssl = [
	"encryption",
	"libsqlite3-sys/bundled-sqlcipher-vendored-openssl",
]

[dependencies]
tauri = { version = "2.11", default-features = false }
sqlx = { version = "0.8", default-features = false, features = [
	"sqlite",
	"runtime-tokio",
] }
libsqlite3-sys = { version = "0.30", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }
